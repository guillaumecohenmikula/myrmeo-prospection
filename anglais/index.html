async function aicSend(text){
  const a = AIC; if(!a || a.busy || a.ended) return;
  a.turns.push({who:'me', text}); a.busy=true; a.err=''; renderAIC(); scrollEnd();
  const transcript = a.turns.map(t=>(t.who==='them'?'Partner':'Learner')+': '+t.text).join('\n');
  const prompt = `You are the conversation partner in a spoken English practice session.
Your role: ${a.sc.role}
The learner is a French-speaking professional (level B1-B2) who wants to get comfortable speaking English. Their lines come from speech recognition or phone dictation, so ignore punctuation, capitalisation and obvious transcription glitches.
Conversation so far:
${transcript}
Return JSON with:
- "reply": your next line, in role. Natural spoken English, 1 or 2 short sentences, usually ending with a question so the learner keeps talking.
- "feedback": in French, one short sentence about the learner's LAST line: the main mistake, or a brief compliment if it was natural.
- "better": a more natural way to say the learner's last line in spoken English (repeat it unchanged if it was already natural).
- "end": true only when the conversation has reached a natural conclusion.`;
  try{
    const r = await askClaude(prompt, TURN_SCHEMA, true);
    if(!r || typeof r.reply!=='string') throw {code:'bad_output'};
    const me = a.turns[a.turns.length-1]; me.feedback=String(r.feedback||''); me.better=String(r.better||'');
    a.turns.push({who:'them', text:r.reply}); a.suggestEnd = !!r.end;
    a.busy=false;
    if(AIC===a && currentView==='oral'){ renderAIC(); scrollEnd(); }
    themSays(r.reply);
    return;
  }catch(e){ a.turns.pop(); a.err = aiErr(e); }
  a.busy=false;
  if(AIC===a && currentView==='oral'){ renderAIC(); scrollEnd(); }
}
async function aicEnd(){
  const a = AIC; if(!a || a.busy) return;
  stopRec(); try{ speechSynthesis.cancel(); }catch(e){}
  a.ended=true; a.err='';
  const n = a.turns.filter(t=>t.who==='me').length;
  a.xp = Math.min(30, 3*n); addXp(a.xp); S.oral.ai=(S.oral.ai||0)+1; save(); renderTop();
  renderAIC(); scrollEnd();
  const transcript = a.turns.map(t=>(t.who==='them'?'Partner':'Learner')+': '+t.text).join('\n');
  const arr = v => Array.isArray(v) ? v.map(String).slice(0,3) : [];
  try{
    const r = await askClaude(`You coach a French-speaking professional on spoken English (B1-B2). Here is a conversation they just had (their lines come from speech recognition):
${transcript}
Return JSON with "strengths" (up to 3 short points IN FRENCH), "improve" (up to 3 short, concrete points IN FRENCH) and "phrases" (up to 3 natural English phrases they could reuse in this kind of conversation).`, SUMMARY_SCHEMA, false);
    a.summary = {strengths:arr(r&&r.strengths), improve:arr(r&&r.improve), phrases:arr(r&&r.phrases)};
  }catch(e){ a.summary = {strengths:[], improve:[], phrases:[]}; a.err = aiErr(e); }
  if(AIC===a && currentView==='oral'){ renderAIC(); scrollEnd(); }
}

/* ---------- Profil ---------- */
function renderProfile(){
  const acc = S.stats.answered ? Math.round(S.stats.correct/S.stats.answered*100) : 0;
  const nDone = Object.keys(S.done).length;
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(Date.now()-(6-i)*DAY); return {k:dkey(d), l:'DLMMJVS'[d.getDay()]}; });
  const max=Math.max(S.settings.goal, ...days.map(d=>S.days[d.k]||0));
  const seg=(id,vals,cur,fmt)=>`<div class="seg" id="${id}">${vals.map(v=>`<button data-v="${v}" class="${String(v)===String(cur)?'on':''}">${fmt?fmt(v):v}</button>`).join('')}</div>`;
  const tog=(id,label,sub,val)=>`<div class="toggle"><label for="${id}" style="margin:0;font-weight:700">${label}<small>${sub}</small></label><input type="checkbox" id="${id}" ${val?'checked':''}></div>`;
  $('v-profile').innerHTML=`
    <div class="stats">
      <div class="st" style="color:var(--gold)">${I.flame}<div><b class="num">${streakNow()}</b><span>jours de série</span></div></div>
      <div class="st" style="color:var(--primary)">${I.bolt}<div><b class="num">${S.xp}</b><span>XP au total</span></div></div>
      <div class="st" style="color:var(--ok)">${I.check}<div><b class="num">${nDone} / ${LESSONS.length}</b><span>leçons terminées</span></div></div>
      <div class="st" style="color:var(--heart)">${I.target}<div><b class="num">${acc}%</b><span>de bonnes réponses</span></div></div>
    </div>
    <h3 class="section-h">7 derniers jours</h3>
    <div class="card"><div class="week">${days.map((d,i)=>{ const v=S.days[d.k]||0; return `<div class="wk${v>=S.settings.goal?' goal':''}${i===6?' is-today':''}">
      <div class="col"><i style="height:${Math.round(v/max*100)}%"></i></div><b class="num" style="font-size:12px">${v}</b><span>${d.l}</span></div>`; }).join('')}</div>
      <p style="font-size:13px">Barres dorées : objectif atteint (${S.settings.goal} XP).</p></div>
    <h3 class="section-h">Réglages</h3>
    <div class="card set">
      <div><label>Objectif quotidien</label>${seg('sGoal',[10,20,30,50],S.settings.goal,v=>v+' XP')}</div>
      ${canSpeak?`<div><label>Accent de la voix</label>${seg('sAccent',['en-GB','en-US'],S.settings.accent,v=>v==='en-GB'?'Britannique':'Américain')}</div>
      <div><label>Vitesse de lecture</label>${seg('sRate',[0.8,0.95,1.1],S.settings.rate,v=>({0.8:'Lente',0.95:'Normale',1.1:'Rapide'})[v])}</div>
      ${tog('sAuto','Lire les réponses à voix haute','Après chaque vérification',S.settings.autoread)}`:''}
      ${tog('sSpeakL','Exercices oraux dans les leçons','Lire à voix haute et traduire à l\'oral',S.settings.speakInLessons)}
      ${micPossible?`<div><label>Pour répondre à l'oral</label>${seg('sInput',['mic','type'],S.settings.input,v=>v==='mic'?'Micro du navigateur':'Dictée du clavier')}</div>`:''}
      ${tog('sSound','Effets sonores','Bonne et mauvaise réponse',S.settings.sound)}
      ${sampleFn?'':`<div><label for="sKey">Clé API Anthropic (discussions et coach)</label>
        <div class="custom-row"><input id="sKey" type="password" autocomplete="off" spellcheck="false" placeholder="${apiKey()?'Clé enregistrée':'sk-ant-…'}"><button class="btn small" id="sKeySave">Enregistrer</button></div>
        <span class="hint2">${apiKey()?'Une clé est enregistrée dans ce navigateur. <button class="linkbtn" id="sKeyDel">Supprimer la clé</button>'
          :'Facultatif. Crée une clé sur console.anthropic.com. Elle reste dans ce navigateur et sert seulement à appeler Claude. Chaque discussion coûte quelques centimes sur ton compte Anthropic.'}</span></div>`}
      <div class="sync-note ${cloudRef?'cloud':''}"><i></i>${cloudRef?'Progression enregistrée sur ton compte Claude, retrouvée sur tous tes appareils.':'Progression enregistrée dans ce navigateur.'}</div>
      <div><button class="linkbtn" id="sReset">Remettre la progression à zéro</button></div>
    </div>`;
  const bindSeg=(id,key,cast)=>$(id)&&$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.settings[key]=cast(b.dataset.v); save(); renderProfile(); renderTop();
    if(key==='accent'||key==='rate') speak('Nice to meet you.'); });
  bindSeg('sGoal','goal',Number); bindSeg('sAccent','accent',String); bindSeg('sRate','rate',Number); bindSeg('sInput','input',String);
  const bindTog=(id,key)=>$(id)&&($(id).onchange=e=>{ S.settings[key]=e.target.checked; save(); renderTop(); });
  bindTog('sAuto','autoread'); bindTog('sSpeakL','speakInLessons'); bindTog('sSound','sound');
  if($('sKeySave')) $('sKeySave').onclick=()=>{ const v=$('sKey').value.trim(); if(!v) return $('sKey').focus();
    try{ localStorage.setItem(KEY+'-apikey', v); }catch(e){} renderAll(); };
  if($('sKeyDel')) $('sKeyDel').onclick=()=>{ try{ localStorage.removeItem(KEY+'-apikey'); }catch(e){} apiClient=null; renderAll(); };
  $('sReset').onclick=()=>{
    openSheet(`<div class="eyebrow">Réinitialiser</div><h3>Tout effacer ?</h3><p>XP, série, leçons terminées et points à revoir seront supprimés. Tes réglages sont conservés.</p>
      <div class="row"><button class="btn ko" id="shYes">Effacer ma progression</button><button class="btn ghost" id="shNo">Annuler</button></div>`);
    $('shNo').onclick=closeSheet;
    $('shYes').onclick=()=>{ const keep=S.settings; S=defaults(); S.settings=keep; save(); closeSheet(); renderAll(); };
  };
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
try{ const v=localStorage.getItem(KEY+'-view'); if(v && ['path','oral','review','profile'].includes(v)) currentView=v; }catch(e){}
['path','oral','review','coach','profile'].forEach(x=>$('v-'+x).hidden = x!==currentView);
renderAll();
setInterval(()=>{ if(!lessonOpen) renderTop(); }, 60000);
initCloud();
(async()=>{
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const s = await claude.use('sample');
    if(s){ sampleFn=s; if(!lessonOpen) renderAll(); }
  }catch(e){}
})();
</script>
