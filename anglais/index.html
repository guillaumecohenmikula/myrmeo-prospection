<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anglais Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one narrow column (path of lesson nodes), sticky stat bar on top, tab bar at the bottom,
   lessons open as a full-screen sheet with a check bar pinned to the bottom. */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --sunk:#E3E9F2; --line:#D3DBE7;
  --ink:#1E3A64; --ink-2:#56688A; --ink-3:#8C9AB3;
  --primary:#1E3A64; --primary-ledge:#0F2344; --on-primary:#FFFFFF;
  --gold:#E89A1E; --gold-soft:#FCEFD6;
  --ok:#23895B; --ok-soft:#DDF3E8; --ok-ledge:#176641;
  --ko:#C8503F; --ko-soft:#FBE4DF; --ko-ledge:#99382A;
  --heart:#E0475C;
  --shadow:rgba(30,58,100,.14);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#172136; --sunk:#111A2B; --line:#2A3853;
    --ink:#E6ECF7; --ink-2:#A3B3D0; --ink-3:#6E7F9E;
    --primary:#7FA6F5; --primary-ledge:#4C73C4; --on-primary:#0E1524;
    --gold:#F2B04A; --gold-soft:#3A2E17;
    --ok:#4CC08A; --ok-soft:#14322A; --ok-ledge:#2E8A5F;
    --ko:#F07A68; --ko-soft:#3A1E1C; --ko-ledge:#B4503F;
    --heart:#FF6B80; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#172136; --sunk:#111A2B; --line:#2A3853;
  --ink:#E6ECF7; --ink-2:#A3B3D0; --ink-3:#6E7F9E;
  --primary:#7FA6F5; --primary-ledge:#4C73C4; --on-primary:#0E1524;
  --gold:#F2B04A; --gold-soft:#3A2E17;
  --ok:#4CC08A; --ok-soft:#14322A; --ok-ledge:#2E8A5F;
  --ko:#F07A68; --ko-soft:#3A1E1C; --ko-ledge:#B4503F;
  --heart:#FF6B80; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}
.stat-pill{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px}
.stat-pill svg{width:22px;height:22px}
.stat-pill.flame{color:var(--gold)} .stat-pill.flame.cold{color:var(--ink-3)}
.stat-pill.xp{color:var(--primary)}
.stat-pill.hearts{color:var(--heart)}

/* ---------- views ---------- */
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.view[hidden]{display:none}

.today{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;margin-bottom:22px}
.today-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.today h2{font-size:17px}
.today .muted{font-size:13px;color:var(--ink-2)}
.bar{height:12px;border-radius:8px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .4s ease}
.today .cta-review{justify-self:start}

.unit{margin-bottom:30px}
.unit-banner{border-radius:var(--r);padding:16px 18px;color:#fff;display:grid;gap:4px;position:relative;overflow:hidden}
.unit-banner .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;opacity:.9;display:flex;gap:8px;align-items:center}
.cefr{background:rgba(255,255,255,.22);border-radius:6px;padding:1px 7px;font-weight:700;letter-spacing:.04em}
.unit-banner h2{font-size:22px}
.unit-banner p{margin:0;font-size:14px;opacity:.92}
.unit-banner .uprog{font-size:12.5px;opacity:.9;margin-top:4px}
.unit.locked .unit-banner{filter:saturate(.25) brightness(.95);opacity:.75}

.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node-wrap.has-tag{margin-top:40px}
.node{width:74px;height:70px;border-radius:50%;border:none;background:var(--uc);color:#fff;
  box-shadow:0 7px 0 var(--ucl);display:grid;place-items:center;transition:transform .08s,box-shadow .08s;position:relative}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ucl)}
.node.locked{background:var(--sunk);color:var(--ink-3);box-shadow:0 7px 0 var(--line)}
.node.done{background:var(--gold);box-shadow:0 7px 0 #B8730C;color:#fff}
.node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--uc);opacity:.35;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.96);opacity:.45}50%{transform:scale(1.06);opacity:.15}}
.node-tag{position:absolute;bottom:calc(100% + 14px);background:var(--surface);border:2px solid var(--line);color:var(--uc);
  font-weight:700;font-size:13px;padding:5px 11px;border-radius:10px;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.node-tag::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);
  border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
.node-label{font-size:12.5px;color:var(--ink-2);margin-top:12px;text-align:center;max-width:140px;line-height:1.3}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:13px;padding:13px 20px;font-weight:700;font-size:15.5px;letter-spacing:.03em;text-transform:uppercase;
  background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-ledge);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--primary-ledge)}
.btn:disabled{background:var(--sunk);color:var(--ink-3);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);color:#2B1B00;box-shadow:0 4px 0 #B8730C}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-ledge)}
.btn.ko{background:var(--ko);color:#fff;box-shadow:0 4px 0 var(--ko-ledge)}
.btn.small{padding:9px 14px;font-size:13.5px}
.btn.block{width:100%}
.linkbtn{background:none;border:none;color:var(--ink-2);text-decoration:underline;padding:6px;font-size:14px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{background:none;border:2px solid transparent;border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;position:relative;min-width:68px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--primary);border-color:var(--line);background:var(--sunk)}
.nav .badge{position:absolute;top:2px;right:10px;background:var(--heart);color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;min-width:18px;text-align:center}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,34,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
  display:grid;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.sheet h3{font-size:22px}
.sheet p{margin:0;color:var(--ink-2)}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1}

/* ---------- lesson ---------- */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.l-head{max-width:640px;width:100%;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.iconbtn{background:none;border:none;color:var(--ink-3);padding:4px;border-radius:8px}
.iconbtn svg{width:26px;height:26px}
.l-prog{flex:1;height:16px;border-radius:9px;background:var(--sunk);overflow:hidden}
.l-prog i{display:block;height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .35s ease;
  background-image:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28));background-size:100% 35%;background-repeat:no-repeat;background-position:0 30%}
.l-hearts{display:flex;align-items:center;gap:4px;color:var(--heart);font-weight:700}
.l-hearts svg{width:24px;height:24px}
.l-body{flex:1;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;padding:8px 16px 24px}
.l-foot{border-top:2px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);transition:background .2s}
.l-foot-in{max-width:640px;margin:0 auto;display:grid;gap:12px}
.l-foot.ok{background:var(--ok-soft);border-color:transparent}
.l-foot.ko{background:var(--ko-soft);border-color:transparent}
.fb{display:grid;gap:4px}
.fb[hidden]{display:none}
.fb .fb-title{font-family:var(--f-display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px}
.l-foot.ok .fb-title{color:var(--ok)} .l-foot.ko .fb-title{color:var(--ko)}
.fb .fb-sol{font-weight:700;font-size:16px}
.l-foot.ko .fb-sol{color:var(--ko)}
.fb .fb-ex{font-size:14px;color:var(--ink-2)}
.fb .fb-title svg{width:26px;height:26px}

.ex-title{font-family:var(--f-display);font-weight:800;font-size:23px;margin:10px 0 18px}
.prompt{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 15px;font-size:17px;position:relative;min-width:0}
.say{flex:none;width:44px;height:44px;border-radius:12px;border:none;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 3px 0 var(--primary-ledge)}
.say svg{width:24px;height:24px}
.say.inline{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 0 var(--primary-ledge)}
.say.inline svg{width:19px;height:19px}

.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;
  padding:13px 14px;box-shadow:0 3px 0 var(--line);font-size:16px}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink-3);font-weight:700}
.opt.sel{border-color:var(--primary);background:var(--sunk);box-shadow:0 3px 0 var(--primary)}
.opt.sel .k{border-color:var(--primary);color:var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft);box-shadow:0 3px 0 var(--ko)}
.opt:disabled{cursor:default}

.sentence{font-size:20px;line-height:1.9;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:20px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink-3);text-align:center;color:var(--primary);font-weight:700;padding:0 6px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:0 3px 0 var(--line);font-size:16.5px}
.chip.sel{border-color:var(--primary);box-shadow:0 3px 0 var(--primary);color:var(--primary);font-weight:700}
.chip.ghost{visibility:hidden}

.answer{min-height:122px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:12px 0;margin-bottom:22px;
  display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;
  background-image:linear-gradient(transparent 59px,var(--line) 59px,var(--line) 61px,transparent 61px);background-size:100% 61px}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tok{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 13px;box-shadow:0 3px 0 var(--line);font-size:17px}
.tok.used{background:var(--sunk);color:transparent;box-shadow:none;border-color:var(--sunk)}
.tok:disabled{cursor:default}

.listen-btns{display:flex;gap:14px;justify-content:center;margin:6px 0 22px}
.say.big{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 0 var(--primary-ledge)}
.say.big svg{width:46px;height:46px}
.say.slow{width:64px;height:64px;align-self:flex-end;border-radius:16px;font-weight:700;font-size:14px}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pair{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 10px;box-shadow:0 3px 0 var(--line);font-size:15px;min-height:58px;line-height:1.3}
.pair.sel{border-color:var(--primary);box-shadow:0 3px 0 var(--primary);color:var(--primary)}
.pair.matched{opacity:.35;box-shadow:none;border-color:var(--ok);color:var(--ok)}
.pair.err{border-color:var(--ko);box-shadow:0 3px 0 var(--ko);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.done-screen{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:28px}
.done-screen h2{font-size:30px}
.done-screen p{margin:0;color:var(--ink-2)}
.done-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.tile{border-radius:14px;border:2px solid var(--tc);overflow:hidden;text-align:center}
.tile .tl{background:var(--tc);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px}
.tile .tv{font-family:var(--f-display);font-weight:800;font-size:24px;padding:10px 4px;color:var(--tc)}
.medal{width:120px;height:120px}

/* ---------- review / coach / profile ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.card h2{font-size:21px}
.card p{margin:0;color:var(--ink-2)}
.section-h{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin:26px 0 10px;font-family:var(--f-body);font-weight:700}
.mist-list{display:grid;gap:8px}
.mist{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14.5px}
.mist span{min-width:0}
.mist em{font-style:normal;color:var(--ink-3);font-size:12.5px;flex:none}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.st svg{width:28px;height:28px;flex:none}
.st b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1}
.st span{font-size:12.5px;color:var(--ink-2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:8px}
.wk{display:grid;grid-template-rows:1fr auto auto;height:100%;gap:4px;text-align:center;font-size:12px;color:var(--ink-2)}
.wk .col{display:flex;align-items:flex-end;justify-content:center}
.wk .col i{display:block;width:70%;max-width:32px;border-radius:7px 7px 3px 3px;background:var(--primary);min-height:3px}
.wk.goal .col i{background:var(--gold)}
.wk.is-today b{color:var(--ink)}
.wk.is-today span{color:var(--ink);font-weight:700}
.set{display:grid;gap:16px}
.set label{font-weight:700;font-size:14.5px;display:block;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg button.on{border-color:var(--primary);color:var(--primary);background:var(--sunk)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.toggle small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:400}
.toggle input{width:22px;height:22px;accent-color:var(--primary);flex:none}
.sync-note{font-size:13px;color:var(--ink-2);display:flex;gap:7px;align-items:center}
.sync-note i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.sync-note.cloud i{background:var(--ok)}

.scen{display:grid;gap:8px}
.scen button{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14.5px;box-shadow:0 3px 0 var(--line)}
.scen button.on{border-color:var(--primary);box-shadow:0 3px 0 var(--primary)}
.scen button b{display:block;font-size:15px}
.scen button span{color:var(--ink-2);font-size:13px}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:12px;padding:12px;font:16px/1.5 var(--f-body);background:var(--surface);color:var(--ink);resize:vertical}
.coach-out{display:grid;gap:12px}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-size:40px;color:var(--primary)}
.corrected{background:var(--ok-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap}
.corrected div{min-width:0;flex:1}
.issue{border-left:4px solid var(--ko);padding:4px 0 4px 12px;font-size:14.5px}
.issue s{color:var(--ko)} .issue ins{text-decoration:none;color:var(--ok);font-weight:700}
.issue p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.tip{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.err-line{color:var(--ko);font-size:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.brand small{display:none}.top-in{gap:10px}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">Anglais Pro<small>Business English, 5 minutes par jour</small></div>
    <div class="stat-pill flame" id="topStreak" title="Série de jours"></div>
    <div class="stat-pill xp" id="topXp" title="XP total"></div>
    <div class="stat-pill hearts" id="topHearts" title="Cœurs"></div>
  </div>
</header>

<main>
  <section class="view" id="v-path"></section>
  <section class="view" id="v-review" hidden></section>
  <section class="view" id="v-coach" hidden></section>
  <section class="view" id="v-profile" hidden></section>
</main>

<nav class="nav" aria-label="Navigation">
  <div class="nav-in" id="nav"></div>
</nav>

<div class="lesson" id="lesson" hidden>
  <div class="l-head">
    <button class="iconbtn" id="lQuit" aria-label="Quitter la leçon"></button>
    <div class="l-prog" aria-hidden="true"><i id="lBar"></i></div>
    <div class="l-hearts" id="lHearts"></div>
  </div>
  <div class="l-body" id="lBody"></div>
  <div class="l-foot" id="lFoot">
    <div class="l-foot-in">
      <div class="fb" id="lFb" hidden></div>
      <button class="btn block" id="lMain" disabled>Vérifier</button>
    </div>

<div id="sheetHost"></div>

<script>
/* =====================================================================
   CONTENU — 8 unités, 22 leçons. Explications en français.
   M = QCM réponse anglaise, MF = QCM réponse française,
   F = phrase à trou, O = phrase à reconstruire (FR -> EN)
   ===================================================================== */
const M  = (q,a,o,ex) => ({t:'mcq', q, a, o, ex, say:a});
const MF = (q,a,o,ex) => ({t:'mcq', q, a, o, ex});
const F  = (s,a,o,ex) => ({t:'fill', s, a, o, ex, say:s.replace('___',a)});
const O  = (fr,en,ex) => ({t:'order', fr, en, ex, say:en});
const L  = (id,title,vocab,items) => ({id,title,vocab,items});

const UNITS = [
{id:'u1', title:'Emails professionnels', level:'B1', color:'#3767D0', ledge:'#244A9E', desc:'Ouvrir, relancer, joindre un devis', lessons:[
  L('u1l1','Ouvrir et conclure',
    [['Cordialement','Kind regards'],['Je vous écris au sujet de','I\'m writing regarding'],['ci-joint','attached'],['N\'hésitez pas à','Feel free to'],['Dans l\'attente de votre réponse','I look forward to hearing from you']],
    [F('I look forward to ___ from you.','hearing',['hear','have heard'],'Après « look forward to », le verbe prend -ing : « to » est ici une préposition.'),
     MF('Formule d\'appel pour un destinataire dont vous ignorez le nom :','Dear Sir or Madam,',['Hi there!','Hello friend,'],'« Dear Sir or Madam » reste la norme. Si vous connaissez le nom : « Dear Ms Martin, ».'),
     O('Je vous écris au sujet de votre demande de devis.','I\'m writing regarding your request for a quote.'),
     M('Complétez : « Please find attached… »','the invoice for March.',['to the invoice for March.','with the invoice for March.'],'« Please find attached » est suivi directement du nom, sans préposition.'),
     O('N\'hésitez pas à me contacter si vous avez des questions.','Feel free to contact me if you have any questions.'),
     M('Quelle signature convient à un email client ?','Best regards,',['Cheers mate,','See ya,'],'« Best regards » ou « Kind regards » : neutres et professionnels.'),
     F('Thank you ___ your quick reply.','for',['of','to'],'« Thank you for » + nom ou verbe en -ing.')]),
  L('u1l2','Demander et relancer',
    [['relancer','to follow up'],['une échéance','a deadline'],['dès que possible','as soon as possible'],['un rappel','a reminder'],['à votre convenance','at your convenience']],
    [O('Je me permets de vous relancer concernant ma proposition.','I\'m following up on my proposal.','« Je me permets de » ne se traduit pas : l\'anglais va droit au but.'),
     M('La formulation la plus polie pour demander un document :','Could you please send me the contract?',['Send me the contract.','I want the contract now.'],'« Could you please… » adoucit la demande. L\'impératif seul sonne sec.'),
     F('I would be grateful if you ___ confirm by Friday.','could',['can','will'],'Structure au conditionnel : « I would be grateful if you could… ».'),
     O('Pourriez-vous confirmer d\'ici vendredi ?','Could you confirm this by Friday?','« by » = au plus tard (d\'ici).'),
     F('Just a quick ___ about our meeting tomorrow.','reminder',['remind','souvenir'],'« remind » est le verbe, « reminder » le nom. « souvenir » désigne un objet-souvenir.'),
     M('Pas de réponse depuis une semaine. Comment ouvrez-vous la relance ?','I just wanted to follow up on my email from last week.',['Why haven\'t you answered me?','You forgot my email.'],'« I just wanted to follow up » est la formule de relance standard, neutre et sans reproche.'),
     O('Je reviens vers vous dès que possible.','I\'ll get back to you as soon as possible.','Revenir vers quelqu\'un = « get back to someone ».')]),
  L('u1l3','Devis, factures, paiements',
    [['une facture','an invoice'],['un devis','a quote'],['un bon de commande','a purchase order'],['un acompte','a deposit'],['les conditions de paiement','payment terms']],
    [M('Corrigez : « I send you the file. »','I\'m sending you the file.',['I sended you the file.','I am send you the file.'],'L\'action a lieu au moment où vous écrivez : présent continu. Autre option : « I\'ve attached the file ».'),
     F('Payment is due ___ 30 days.','within',['in the','since'],'« within 30 days » = dans un délai de 30 jours.'),
     O('Vous trouverez ci-joint notre devis.','Please find attached our quote.'),
     M('« Un acompte de 30 % »','a 30% deposit',['a 30% account','a 30% advance count'],'« account » = un compte. Un acompte se dit « deposit » ou « down payment ».'),
     O('Le bon de commande est en pièce jointe.','The purchase order is attached.'),
     F('Could you send me an updated ___ with the new prices?','quote',['devise','cote'],'Devis = « quote » ou « quotation ». En anglais, « devise » est un verbe : concevoir.'),
     MF('« Payment terms » désigne…','les conditions de paiement',['les termes anglais du paiement','la fin du paiement'],'Ex. : « Our payment terms are 30 days net. »')]),
]},
{id:'u2', title:'Téléphone et visio', level:'B1', color:'#14917F', ledge:'#0C6A5C', desc:'Se présenter, gérer la ligne, fixer un créneau', lessons:[
  L('u2l1','Décrocher et se présenter',
    [['Ne quittez pas','Hold on, please'],['Je vous le passe','I\'ll put you through'],['laisser un message','to leave a message'],['rappeler','to call back'],['C\'est de la part de qui ?','Who\'s calling, please?']],
    [M('Au téléphone, comment vous présentez-vous ?','Hello, this is Guillaume from Myrmeo.',['Hello, here is Guillaume from Myrmeo.','Hello, I\'m calling me Guillaume.'],'Au téléphone : « this is… ». « Here is » est un calque de « ici… ».'),
     O('Puis-je parler au responsable, s\'il vous plaît ?','Could I speak to the manager, please?'),
     F('She\'s not available right now. Can I take a ___?','message',['letter','mail'],'« Can I take a message? » est la formule consacrée.'),
     O('Je vous rappelle dans dix minutes.','I\'ll call you back in ten minutes.'),
     M('Votre interlocuteur parle trop vite. Vous dites :','Sorry, could you speak a bit more slowly?',['Speak slow please.','You talk too fast.'],'Commencer par « Sorry » rend la demande naturelle et polie.'),
     F('Could you ___ that, please? The line is bad.','repeat',['reply','recall'],'« recall » = se souvenir ou rappeler un produit défectueux.'),
     MF('« I\'ll put you through » signifie…','Je vous mets en relation.',['Je vous raccroche au nez.','Je vous fais passer un test.'],'Variante : « I\'ll transfer your call ».')]),
  L('u2l2','Visio et soucis techniques',
    [['Vous êtes en sourdine','You\'re on mute'],['partager mon écran','to share my screen'],['Vous m\'entendez ?','Can you hear me?'],['un lien de réunion','a meeting link'],['Ça coupe','You\'re breaking up']],
    [O('Je pense que vous êtes en sourdine.','I think you\'re on mute.'),
     M('Vous voulez montrer une présentation :','Let me share my screen.',['Let me divide my screen.','Let me part my screen.'],'« share » = partager. « divide » = diviser.'),
     F('Sorry, you ___ out for a second. Could you repeat that?','cut',['cutted','cuts'],'« to cut out » = couper (le son). Verbe irrégulier : cut, cut, cut.'),
     O('Pouvez-vous voir mon écran ?','Can you see my screen?'),
     M('Vous arrivez en retard à une visio :','Sorry I\'m late, I had trouble connecting.',['Sorry for the retard.','Sorry, I was in delay.'],'« retard » est une insulte en anglais. Être en retard = « to be late ».'),
     F('I\'ll send you the meeting ___ by email.','link',['lien','bond'],'Lien = « link ».'),
     O('On fait une pause de cinq minutes ?','Shall we take a five-minute break?','Adjectif composé : « five-minute », sans s.')]),
  L('u2l3','Fixer un rendez-vous',
    [['planifier une réunion','to schedule a meeting'],['reporter','to postpone'],['annuler','to cancel'],['un créneau','a time slot'],['Ça vous convient ?','Does that work for you?']],
    [O('Est-ce que mardi à 10 h vous conviendrait ?','Would Tuesday at 10 am work for you?'),
     F('We need to ___ the meeting to next week.','postpone',['report','retard'],'« report » = rapporter, rendre compte. Reporter = « postpone », « reschedule » ou « push back ».'),
     M('« Le 15 mars à 14 h »','on March 15th at 2 pm',['in March 15th at 2 pm','at March 15th on 2 pm'],'« on » + date ou jour, « at » + heure, « in » + mois ou année.'),
     O('Je n\'ai aucun créneau libre jeudi.','I don\'t have any free slots on Thursday.'),
     MF('« I\'m afraid I have to cancel » est…','une façon polie d\'annoncer une annulation',['l\'aveu d\'une peur','une menace'],'« I\'m afraid… » = « Je crains que… », pour adoucir une mauvaise nouvelle.'),
     F('I\'m available ___ Monday and Wednesday.','on',['in','at'],'« on » devant un jour de la semaine.'),
     M('Vous proposez deux options :','I\'m free on Monday afternoon or Wednesday morning. Which suits you best?',['Monday or Wednesday, you choose quick.','I\'m libre Monday or Wednesday.'],'« Which suits you best? » = « Qu\'est-ce qui vous arrange le mieux ? »')]),
]},
{id:'u3', title:'Réunions', level:'B1+', color:'#7A55C9', ledge:'#593A9B', desc:'Animer, donner son avis, répartir les actions', lessons:[
  L('u3l1','Lancer et animer',
    [['l\'ordre du jour','the agenda'],['le compte rendu','the minutes'],['passer au point suivant','to move on to the next item'],['prendre la parole','to take the floor'],['un tour de table','a round of introductions']],
    [MF('En réunion, « the agenda » désigne…','l\'ordre du jour',['l\'agenda papier','le calendrier personnel'],'Un agenda personnel se dit « a diary » (UK) ou « a planner » (US).'),
     O('Commençons, si tout le monde est là.','Let\'s get started, if everyone is here.'),
     F('Let\'s move ___ to the next item.','on',['in','at'],'« move on to » = passer à.'),
     O('Le but de cette réunion est de valider le budget.','The purpose of this meeting is to approve the budget.','Valider une décision = « approve ». « validate » s\'emploie plutôt pour des données.'),
     M('Quelqu\'un s\'écarte du sujet. Vous dites :','Let\'s get back to the main point.',['Stop talking, please.','You are out of the subject.'],'« Être hors sujet » se dit « to be off topic ».'),
     F('Who\'s going to take the ___ today?','minutes',['resume','report'],'« take the minutes » = rédiger le compte rendu. Un « résumé » (US) = un CV.'),
     O('Je vais envoyer le compte rendu à tout le monde.','I\'ll send the minutes to everyone.')]),
  L('u3l2','Donner son avis',
    [['à mon avis','in my opinion'],['Je suis d\'accord','I agree'],['Je n\'en suis pas sûr','I\'m not sure about that'],['Tout à fait','Absolutely'],['Je vois ce que vous voulez dire','I see what you mean']],
    [M('« Je suis d\'accord avec vous »','I agree with you.',['I am agree with you.','I\'m agree with you.'],'« agree » est un verbe : jamais de « am » devant.'),
     O('Je vois ce que vous voulez dire, mais je ne suis pas convaincu.','I see what you mean, but I\'m not convinced.'),
     M('Une façon diplomate de contredire :','I see your point, but have we considered the cost?',['That\'s wrong.','No, it\'s a stupid idea.'],'Reconnaître le point de l\'autre, puis poser une question : la contradiction passe mieux.'),
     F('From my point of ___, this is too risky.','view',['vue','sight'],'« from my point of view » = de mon point de vue.'),
     O('Pourriez-vous développer ce point ?','Could you elaborate on that point?'),
     F('I\'d like to ___ something, if I may.','add',['adding','added'],'Après « would like to », la base verbale.'),
     M('Pour interrompre poliment :','Sorry to interrupt, but could I just add something?',['Wait, wait, me!','Shut up one second.'],'« Sorry to interrupt » ou « Can I jump in here? ».')]),
  L('u3l3','Conclure et répartir',
    [['les prochaines étapes','the next steps'],['une action à mener','an action item'],['résumer','to sum up'],['d\'ici la fin de la semaine','by the end of the week'],['faire un point','to touch base']],
    [O('Pour résumer, nous avons pris trois décisions.','To sum up, we\'ve made three decisions.','Prendre une décision = « make a decision ».'),
     F('Julie will send the proposal ___ Friday.','by',['until','for'],'« by » = au plus tard. « until » = jusqu\'à (une durée continue).'),
     MF('« Let\'s touch base next week » signifie…','Faisons un point la semaine prochaine.',['Touchons le fond la semaine prochaine.','Changeons de base la semaine prochaine.'],'Expression très courante en entreprise.'),
     O('Quelles sont les prochaines étapes ?','What are the next steps?'),
     F('Thank you all for your ___.','time',['times','temps'],'« Thank you for your time » clôt une réunion ou un appel.'),
     MF('« Can you take ownership of this? »','Pouvez-vous prendre ça en charge ?',['Pouvez-vous acheter ça ?','Pouvez-vous devenir propriétaire de l\'entreprise ?'],'« take ownership » = assumer la responsabilité d\'une tâche.')]),
]},
{id:'u4', title:'Prospection et vente', level:'B2', color:'#D06A1F', ledge:'#9C4B10', desc:'Accrocher, découvrir le besoin, conclure', lessons:[
  L('u4l1','Accrocher un prospect',
    [['un prospect','a lead'],['un décideur','a decision-maker'],['un appel découverte','a discovery call'],['un point de douleur','a pain point'],['une proposition de valeur','a value proposition']],
    [O('Je vous appelle car nous aidons les artisans à gagner du temps.','I\'m calling because we help tradespeople save time.','Artisans = « tradespeople » (plombiers, électriciens…) ou « craftspeople » (métiers d\'art).'),
     M('L\'accroche la plus naturelle :','Do you have two minutes for a quick question?',['Have you two minutes for a quick question?','Do you have two minutes for a fast question?'],'« Have you… ? » sans « do » est vieilli. On dit « a quick question ».'),
     F('We help small businesses ___ their admin work.','streamline',['streamlining','to streamlining'],'« help » + base verbale (ou « to » + base verbale).'),
     M('« Qui prend ce genre de décision chez vous ? »','Who usually makes this kind of decision in your company?',['Who takes this kind of decision at you?','Who is the decider of your house?'],'« make a decision » est la forme standard. « at you » est un calque de « chez vous ».'),
     O('Quel est votre plus gros défi au quotidien ?','What\'s your biggest challenge day to day?'),
     F('Would you be open ___ a 30-minute call next week?','to',['for','at'],'« be open to » + nom ou -ing.'),
     M('Le prospect dit « Just send me an email ». Bonne réponse :','Sure. What would be most useful for you to see in it?',['OK, bye.','No, I prefer to talk now.'],'Accepter, puis poser une question : vous gardez la conversation ouverte.')]),
  L('u4l2','Rendez-vous découverte',
    [['un besoin','a need'],['un délai','a timeline'],['les outils actuels','current tools'],['impliqué dans','involved in'],['une priorité','a priority']],
    [O('Comment gérez-vous vos devis aujourd\'hui ?','How do you handle your quotes at the moment?','« Aujourd\'hui » au sens de « actuellement » = « at the moment » ou « currently ».'),
     MF('Laquelle est une question ouverte, plus utile en découverte ?','What happens when a client pays late?',['Do clients pay late?','Is it a problem?'],'Les questions en What / How font parler le prospect. Les questions fermées appellent « yes » ou « no ».'),
     F('How much time do you ___ on paperwork each week?','spend',['pass','take'],'Passer du temps = « spend time ». « pass time » = tuer le temps.'),
     O('Si je comprends bien, le problème principal est le suivi des paiements.','If I understand correctly, the main issue is tracking payments.'),
     MF('« What would success look like for you? »','À quoi ressemblerait une réussite pour vous ?',['Quel look avez-vous quand vous réussissez ?','Avez-vous déjà réussi ?'],'Question clé pour faire formuler l\'objectif par le client.'),
     F('Is there a budget set ___ for this project?','aside',['beside','away'],'« set aside » = mettre de côté, réserver.'),
     O('Qui d\'autre est impliqué dans la décision ?','Who else is involved in the decision?')]),
  L('u4l3','Proposition et closing',
    [['une offre','an offer'],['un essai gratuit','a free trial'],['un engagement','a commitment'],['conclure une vente','to close a deal'],['un projet pilote','a pilot']],
    [O('Je vous envoie la proposition d\'ici demain.','I\'ll send you the proposal by tomorrow.'),
     MF('« Does this sound like a good fit? »','Est-ce que ça vous semble adapté ?',['Est-ce que ça sonne bien ?','Est-ce que vous êtes en forme ?'],'« a good fit » = une solution adaptée à leur situation.'),
     F('If you sign this month, we can ___ you a 10% discount.','offer',['propose','borrow'],'« propose » = suggérer une idée. On « offers » une remise.'),
     M('Le prospect hésite. Question de closing en douceur :','What would you need to see to move forward?',['So you buy or not?','Sign here please.'],'« move forward » = avancer, passer à l\'étape suivante.'),
     O('Nous pouvons commencer par un pilote de deux semaines.','We can start with a two-week pilot.'),
     F('We offer a ___ trial.','two-week',['two-weeks','twos-week'],'Adjectif composé : pas de s. « a two-week trial ».'),
     MF('Le prospect dit « I\'ll get back to you ». Le plus souvent, cela signifie…','Il a besoin de temps : fixez une date de relance.',['Il signe demain.','Il refuse définitivement.'],'Réponse utile : « Sure. Shall we pencil in a call next Thursday? »')]),
]},
{id:'u5', title:'Négociation', level:'B2', color:'#BE3E66', ledge:'#8E2747', desc:'Prix, objections, accord', lessons:[
  L('u5l1','Prix et conditions',
    [['une remise','a discount'],['un tarif','a rate'],['hors taxes','excluding VAT'],['TTC','including VAT'],['négociable','negotiable']],
    [M('« Le prix est de 1 200 € HT. »','The price is €1,200 excluding VAT.',['The price is €1.200 out of taxes.','The price is 1,200€ without taxes.'],'En anglais, la virgule sépare les milliers (1,200) et le point les décimales. Le symbole € se place avant le nombre.'),
     F('Is there any flexibility ___ the price?','on',['of','at'],'« flexibility on » + sujet de négociation.'),
     O('C\'est un peu au-dessus de notre budget.','That\'s slightly above our budget.'),
     M('Une contre-proposition polie :','Would you consider a lower rate for a longer contract?',['Lower your price or no deal.','Your price is too expensive.'],'Un prix est « too high ». C\'est le produit qui est « too expensive ».'),
     O('Que pouvez-vous faire sur le prix ?','What can you do on the price?'),
     F('The rates are ___ of VAT.','exclusive',['excluded','without'],'« exclusive of VAT » = hors taxes. On dit aussi « excluding VAT » ou « + VAT ».')]),
  L('u5l2','Répondre aux objections',
    [['une objection','an objection'],['un concurrent','a competitor'],['un retour sur investissement','a return on investment'],['une inquiétude','a concern'],['en d\'autres termes','in other words']],
    [M('Le client dit « It\'s too expensive ». Meilleure réponse :','I understand. Compared to what?',['No, it\'s not.','Then buy something cheaper.'],'Reformuler, puis creuser : l\'objection devient une conversation.'),
     O('Je comprends votre inquiétude.','I understand your concern.','Inquiétude = « concern ». « worry » est plus personnel.'),
     F('We\'re currently working ___ another supplier.','with',['on','for'],'Travailler avec un fournisseur = « work with ».'),
     MF('« ROI » signifie…','le retour sur investissement',['le roi de l\'entreprise','le taux d\'intérêt'],'Return On Investment.'),
     O('Qu\'est-ce qui vous ferait changer d\'avis ?','What would change your mind?'),
     F('That\'s a fair ___.','point',['pointe','dot'],'« That\'s a fair point » = « C\'est une remarque juste ».')]),
  L('u5l3','Trouver un accord',
    [['un compromis','a compromise'],['un accord','an agreement'],['les conditions','the terms'],['mettre par écrit','to put in writing'],['Marché conclu','It\'s a deal']],
    [O('Je pense que nous sommes parvenus à un accord.','I think we\'ve reached an agreement.'),
     F('Let\'s put everything in ___.','writing',['write','written'],'« put something in writing » = mettre par écrit.'),
     MF('« Win-win » signifie…','gagnant-gagnant',['deux victoires d\'affilée','gagner deux fois plus'],'« a win-win solution ».'),
     F('We ___ on a compromise for the delivery date.','agreed',['accorded','agree'],'Se mettre d\'accord sur = « agree on ».'),
     O('Nous enverrons le contrat d\'ici lundi.','We\'ll send the contract by Monday.'),
     M('Pour clore la négociation :','Great, so we have a deal.',['Great, so we have a business.','Great, so it\'s a deal of business.'],'« We have a deal » ou « It\'s a deal ».')]),
]},
{id:'u6', title:'Chiffres et présentations', level:'B2', color:'#2E7FB8', ledge:'#1D5A86', desc:'Tendances, pourcentages, prise de parole', lessons:[
  L('u6l1','Nombres et tendances',
    [['augmenter','to increase'],['baisser','to decrease'],['rester stable','to remain stable'],['le chiffre d\'affaires','revenue'],['un trimestre','a quarter']],
    [M('« Le chiffre d\'affaires a augmenté de 15 %. »','Revenue increased by 15%.',['Revenue increased of 15%.','Business figure increased by 15%.'],'« by » pour l\'écart, « to » pour la valeur d\'arrivée.'),
     F('Sales rose ___ €80,000 to €95,000.','from',['of','since'],'« rise from X to Y ».'),
     O('Les coûts sont restés stables cette année.','Costs remained stable this year.'),
     M('Comment lit-on « 2.5 million » ?','two point five million',['two comma five millions','two dot five millions'],'On dit « point » pour la décimale, et « million » reste au singulier après un nombre.'),
     F('Profits fell ___ 3% in the last quarter.','by',['of','from'],'Baisser de 3 % = « fall by 3% ».'),
     MF('« A quarter » dans un rapport financier, c\'est…','un trimestre',['un quart d\'heure','un quartier'],'Q1, Q2… = premier, deuxième trimestre. « trimester » s\'emploie pour la grossesse ou l\'année scolaire (US).'),
     O('Nous prévoyons une hausse importante l\'an prochain.','We expect a significant rise next year.')]),
  L('u6l2','Présenter à l\'oral',
    [['une diapositive','a slide'],['un graphique','a chart'],['comme vous pouvez le voir','as you can see'],['un aperçu','an overview'],['les points clés à retenir','the key takeaways']],
    [O('Je vais commencer par un bref aperçu.','I\'ll start with a brief overview.'),
     F('As you can see ___ this chart, sales are up.','from',['of','by'],'« As you can see from this chart » (ou « in this chart »).'),
     M('Une transition naturelle :','Moving on to the next slide…',['Now, next slide, go.','We pass to the next slide.'],'Passer à = « move on to ». « pass » est un faux ami ici.'),
     O('Cette diapositive montre nos résultats trimestriels.','This slide shows our quarterly results.'),
     F('That\'s a great question. Let me get back to you ___ that.','on',['in','at'],'« get back to you on that » = « je vous réponds plus tard là-dessus ».'),
     M('Pour conclure une présentation :','To wrap up, here are the three key takeaways.',['To finish, here is the end.','In conclusion of all, it\'s finished.'],'« To wrap up » = pour conclure.')]),
]},
{id:'u7', title:'Faux amis et pièges', level:'B2', color:'#5E7F2C', ledge:'#425B1C', desc:'Les erreurs que font tous les francophones', lessons:[
  L('u7l1','Faux amis, série 1',
    [['actuellement','currently'],['éventuellement','possibly'],['une formation','a training course'],['assister à','to attend'],['sensible','sensitive']],
    [MF('« Actually » signifie…','en fait',['actuellement','activement'],'Actuellement = « currently » ou « at the moment ».'),
     F('We are ___ looking for new suppliers.','currently',['actually','eventually'],'Actuellement = « currently ».'),
     MF('« Eventually » signifie…','finalement, au bout du compte',['éventuellement','peut-être'],'Éventuellement = « possibly » ou « if necessary ».'),
     M('« J\'ai assisté à une formation. »','I attended a training course.',['I assisted a formation.','I went to a formation.'],'« assist » = aider. Assister à = « attend ». Une formation = « a training course ».'),
     O('C\'est une information sensible.','This is sensitive information.','« sensible » en anglais = raisonnable.'),
     F('Can you give me some ___ about the project?','information',['informations','an information'],'« information » est indénombrable : jamais de s, jamais « an ».')]),
  L('u7l2','Faux amis, série 2',

const KEY = 'anglais-pro-v1';
const DAY = 864e5, HEART_MS = 30*60*1000, MAX_HEARTS = 5;
const defaults = () => ({v:1, xp:0, days:{}, streak:{count:0,last:null}, done:{}, hearts:MAX_HEARTS, heartsAt:Date.now(),
  mist:{}, stats:{answered:0,correct:0,lessons:0}, settings:{goal:20, accent:'en-GB', rate:0.95, sound:true, autoread:true, infinite:false, unlockAll:false}, updatedAt:0});
function merge(s){ const d=defaults(); s=s&&typeof s==='object'?s:{}; return {...d, ...s, streak:{...d.streak,...(s.streak||{})}, stats:{...d.stats,...(s.stats||{})}, settings:{...d.settings,...(s.settings||{})}, days:s.days||{}, done:s.done||{}, mist:s.mist||{}}; }
function readLocal(){ try{ return merge(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return defaults(); } }
let S = readLocal();
let cloudRef = null, cloudTimer = null;

function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(cloudRef){ clearTimeout(cloudTimer); cloudTimer = setTimeout(()=>{ cloudRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{}); }, 1200); }
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.collection('data/users/'+id).doc('progress');
    const snap = await ref.get();
    const remote = snap.exists ? merge(snap.data()) : null;
    cloudRef = ref;
    if(remote && remote.updatedAt > S.updatedAt){
      S = remote; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      if(!lessonOpen) renderAll();
    } else if(S.updatedAt > 0){ save(); }
    if(currentView==='profile' && !lessonOpen) renderProfile();
  }catch(e){ cloudRef = null; }
}

/* ---------- dates, streak, xp, hearts ---------- */
const dkey = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const yesterday = () => dkey(new Date(Date.now()-DAY));
function streakNow(){ const l=S.streak.last; return (l===dkey()||l===yesterday()) ? S.streak.count : 0; }
function todayXp(){ return S.days[dkey()]||0; }
function addXp(n){
  const t=dkey(); S.xp+=n; S.days[t]=(S.days[t]||0)+n;
  if(S.streak.last!==t){ S.streak.count = S.streak.last===yesterday() ? S.streak.count+1 : 1; S.streak.last=t; }
}
function hearts(){
  if(S.settings.infinite) return Infinity;
  if(S.hearts<MAX_HEARTS){
    const n=Math.floor((Date.now()-S.heartsAt)/HEART_MS);
    if(n>0){ S.hearts=Math.min(MAX_HEARTS,S.hearts+n); S.heartsAt = S.hearts>=MAX_HEARTS ? Date.now() : S.heartsAt+n*HEART_MS; }
  }
  return S.hearts;
}
function loseHeart(){ if(S.settings.infinite) return; hearts(); if(S.hearts===MAX_HEARTS) S.heartsAt=Date.now(); S.hearts=Math.max(0,S.hearts-1); }
function nextHeartIn(){ const ms=HEART_MS-((Date.now()-S.heartsAt)%HEART_MS); return Math.ceil(ms/60000); }

/* ---------- index du contenu ---------- */
const LESSONS = []; const LBY = {};
UNITS.forEach((u,ui)=>u.lessons.forEach((l,li)=>{ const e={u,l,ui,li,g:LESSONS.length}; LESSONS.push(e); LBY[l.id]=e; }));
function unlocked(g){ return S.settings.unlockAll || g===0 || !!S.done[LESSONS[g-1].l.id] || !!S.done[LESSONS[g].l.id]; }
function currentG(){ for(const e of LESSONS){ if(!S.done[e.l.id]) return unlocked(e.g)?e.g:-1; } return -1; }

/* ---------- utilitaires ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const tokens = s => s.replace(/[.?!,…]/g,'').split(/\s+/).filter(Boolean);
const norm = s => s.toLowerCase().replace(/[’]/g,"'");

/* ---------- son et voix ---------- */
let actx=null;
function tone(freqs, dur=0.12, type='sine'){
  if(!S.settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*dur*0.9;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.03); });
  }catch(e){}
}
const sndOk = () => tone([660,880],0.11);
const sndKo = () => tone([220,180],0.16,'triangle');
const sndWin = () => tone([523,659,784,1047],0.13);
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
function voice(){
  try{ const vs=speechSynthesis.getVoices(); const acc=S.settings.accent.toLowerCase();
    return vs.find(v=>v.lang.replace('_','-').toLowerCase()===acc) || vs.find(v=>v.lang.toLowerCase().startsWith('en')) || null; }catch(e){ return null; }
}
function speak(text, rate){
  if(!canSpeak||!text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=S.settings.accent; const v=voice(); if(v) u.voice=v;
    u.rate=rate||S.settings.rate; speechSynthesis.speak(u); }catch(e){}
}
if(canSpeak){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
const sayBtn = (text, cls='') => canSpeak ? `<button class="say ${cls}" data-say="${esc(text)}" aria-label="Écouter">${I.speaker}</button>` : '';
document.addEventListener('click', e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); speak(b.dataset.say, b.dataset.rate?+b.dataset.rate:undefined); } });

/* =====================================================================
   CONSTRUCTION DES EXERCICES
   ===================================================================== */
function vocabEx(e, i, reverse){
  const [fr,en] = e.l.vocab[i];
  const pool = e.u.lessons.flatMap(l=>l.vocab).filter(p=>p[1]!==en && p[0]!==fr);
  const others = shuffle(pool).slice(0,2);
  return reverse
    ? {t:'mcq', key:e.l.id+':v'+i, title:'Que signifie…', q:'« '+en+' »', sayQ:en, a:fr, o:others.map(p=>p[0])}
    : {t:'mcq', key:e.l.id+':v'+i, title:'Comment dit-on…', q:'« '+fr+' »', a:en, o:others.map(p=>p[1]), say:en};
}
function exByKey(key){
  const [lid, rest] = key.split(':'); const e=LBY[lid]; if(!e) return null;
  if(rest==='p') return {t:'pairs', key, pairs:e.l.vocab};
  if(rest[0]==='v') return vocabEx(e, +rest.slice(1), Math.random()<.5);
  const it=e.l.items[+rest]; return it ? {...it, key} : null;
}
function withListen(list){
  if(!canSpeak) return list;
  const i = list.findIndex(x=>x.t==='order');
  if(i>=0) list[i] = {...list[i], t:'listen'};
  return list;
}
function buildLesson(e){
  const v = shuffle(e.l.vocab.map((_,i)=>i)).slice(0,2);
  const items = withListen(shuffle(e.l.items.map((it,i)=>({...it, key:e.l.id+':'+i}))));
  return [vocabEx(e,v[0],false), ...items.slice(0,2), {t:'pairs', key:e.l.id+':p', pairs:e.l.vocab}, vocabEx(e,v[1],true), ...items.slice(2)];
}
function dueKeys(){ const now=Date.now(); return Object.entries(S.mist).filter(([,m])=>m.d<=now).sort((a,b)=>a[1].d-b[1].d).map(([k])=>k); }
function buildReview(){
  const out=[]; const seen=new Set();
  for(const k of dueKeys()){ if(out.length>=8) break; if(k.endsWith(':p')) continue; const x=exByKey(k); if(x){ out.push(x); seen.add(k); } }
  const doneLessons = LESSONS.filter(e=>S.done[e.l.id]);
  let guard=0;
  while(out.length<8 && doneLessons.length && guard++<60){
    const e=pick(doneLessons); const i=Math.floor(Math.random()*e.l.items.length); const k=e.l.id+':'+i;
    if(!seen.has(k)){ seen.add(k); out.push({...e.l.items[i], key:k}); }
  }
  return withListen(shuffle(out));
}
function record(key, ok){
  if(!key || key.endsWith(':p')) return;
  S.stats.answered++; if(ok) S.stats.correct++;
  const m=S.mist[key];
  if(!ok){ S.mist[key]={b:0,d:Date.now()}; return; }
  if(m){ m.b++; if(m.b>=4) delete S.mist[key]; else m.d=Date.now()+[0,1,3,7][m.b]*DAY; }
}

let lessonOpen=false, LS=null, cur=null;

function startLesson(kind, lessonId){
  closeSheet();
  if(kind==='lesson' && hearts()<=0){ return showNoHearts(); }
  const queue = kind==='lesson' ? buildLesson(LBY[lessonId]) : buildReview();
  if(!queue.length) return;
  LS = {kind, lessonId, queue, idx:0, base:queue.length, good:0, mistakes:0, requeued:new Set(), t0:Date.now(), ended:false};
  lessonOpen=true; $('lesson').hidden=false; document.body.style.overflow='hidden';
  $('lQuit').innerHTML=I.close;
  renderEx();
}
function closeLesson(){
  lessonOpen=false; $('lesson').hidden=true; document.body.style.overflow=''; LS=null; cur=null;
  if(canSpeak) try{ speechSynthesis.cancel(); }catch(e){}
  renderAll();
}
function renderLessonHead(){
  $('lBar').style.width = Math.min(100, LS.good/LS.base*100)+'%';
  const h = hearts();
  $('lHearts').innerHTML = LS.kind==='review' ? '<span style="color:var(--ink-2);font-size:13px;font-weight:700">RÉVISION</span>'
    : I.heart + '<span class="num">'+(h===Infinity?'∞':h)+'</span>';
}
function setFoot(state, html){
  const f=$('lFoot'); f.classList.remove('ok','ko'); if(state) f.classList.add(state);
  const fb=$('lFb'); if(html){ fb.innerHTML=html; fb.hidden=false; } else { fb.hidden=true; fb.innerHTML=''; }
}
function setMain(label, enabled, cls){
  const b=$('lMain'); b.textContent=label; b.disabled=!enabled; b.className='btn block'+(cls?' '+cls:'');
}

function renderEx(){
  renderLessonHead();
  setFoot(null,null);
  const ex = LS.queue[LS.idx];
  cur = {ex, checked:false, ready:false};
  const body=$('lBody'); body.scrollTop=0;
  ({mcq:renderMcq, fill:renderFill, order:renderOrder, listen:renderOrder, pairs:renderPairs})[ex.t](ex, body);
  setMain('Vérifier', false);
}
function ready(v){ cur.ready=v; if(!cur.checked) $('lMain').disabled=!v; }

/* --- QCM --- */
function renderMcq(ex, body){
  const opts = shuffle([ex.a, ...ex.o]);
  body.innerHTML = `<h2 class="ex-title">${esc(ex.title||'Choisis la bonne réponse')}</h2>
    <div class="prompt">${ex.sayQ?sayBtn(ex.sayQ):''}<div class="bubble">${esc(ex.q)}</div></div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  if(ex.sayQ) speak(ex.sayQ);
  cur.sel=null; cur.opts=opts;
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(cur.checked) return;
    body.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); cur.sel=+b.dataset.i; ready(true); });
  cur.choose = i => body.querySelector(`.opt[data-i="${i}"]`)?.click();
  cur.check = () => {
    const ok = cur.opts[cur.sel]===ex.a;
    body.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const v=cur.opts[+b.dataset.i];
      if(v===ex.a) b.classList.add('right'); else if(+b.dataset.i===cur.sel) b.classList.add('wrong'); });
    return ok;
  };
  cur.solution = ex.a;
}

/* --- Phrase à trou --- */
function renderFill(ex, body){
  const opts = shuffle([ex.a, ...ex.o]);
  const [pre, post] = ex.s.split('___');
  body.innerHTML = `<h2 class="ex-title">Complète la phrase</h2>
    <div class="sentence">${esc(pre)}<span class="blank" id="blank">&nbsp;</span>${esc(post)}</div>
    <div class="chips">${opts.map((o,i)=>`<button class="chip" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  cur.sel=null; cur.opts=opts;
  body.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ if(cur.checked) return;
    body.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); cur.sel=+b.dataset.i;
    $('blank').textContent=opts[cur.sel]; ready(true); });
  cur.choose = i => body.querySelector(`.chip[data-i="${i}"]`)?.click();
  cur.check = () => { body.querySelectorAll('.chip').forEach(b=>b.disabled=true); return cur.opts[cur.sel]===ex.a; };
  cur.solution = ex.s.replace('___', ex.a);
}

/* --- Remettre dans l'ordre / Dictée --- */
function renderOrder(ex, body){
  const target = tokens(ex.en);
  const unitL = LBY[ex.key.split(':')[0]];
  const pool = unitL ? unitL.u.lessons.flatMap(l=>l.items).filter(x=>x.t==='order'&&x.en!==ex.en).flatMap(x=>tokens(x.en)) : [];
  const lower = new Set(target.map(norm));
  const extra = shuffle([...new Set(pool)].filter(w=>!lower.has(norm(w)))).slice(0, target.length>8?2:3);
  const bank = shuffle([...target, ...extra]).map((w,i)=>({w,i,used:false}));
  const listen = ex.t==='listen';
  body.innerHTML = listen
    ? `<h2 class="ex-title">Écris ce que tu entends</h2>
       <div class="listen-btns">${sayBtn(ex.en,'big')}<button class="say slow" data-say="${esc(ex.en)}" data-rate="0.6" aria-label="Écouter lentement">0,6×</button></div>`
    : `<h2 class="ex-title">Traduis cette phrase</h2>
       <div class="prompt"><div class="bubble">${esc(ex.fr)}</div></div>`;
  body.insertAdjacentHTML('beforeend', `<div class="answer" id="ans"></div><div class="bank" id="bank"></div>`);
  if(listen) setTimeout(()=>speak(ex.en), 250);
  cur.ans=[];
  const draw=()=>{
    $('ans').innerHTML = cur.ans.map((t,k)=>`<button class="tok" data-k="${k}">${esc(t.w)}</button>`).join('');
    $('bank').innerHTML = bank.map(t=>`<button class="tok ${t.used?'used':''}" data-i="${t.i}" ${t.used?'disabled aria-hidden="true"':''}>${esc(t.w)}</button>`).join('');
    $('ans').querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ if(cur.checked) return; const t=cur.ans.splice(+b.dataset.k,1)[0]; t.used=false; draw(); });
    $('bank').querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ if(cur.checked) return; const t=bank[+b.dataset.i]; if(t.used) return; t.used=true; cur.ans.push(t); draw(); });
    ready(cur.ans.length>0);
  };
  draw();
  cur.choose = i => { const free=bank.filter(t=>!t.used); if(free[i]){ free[i].used=true; cur.ans.push(free[i]); draw(); } };
  cur.back = () => { const t=cur.ans.pop(); if(t){ t.used=false; draw(); } };
  cur.check = () => { body.querySelectorAll('.tok').forEach(b=>b.disabled=true);
    return cur.ans.map(t=>norm(t.w)).join(' ') === target.map(norm).join(' '); };
  cur.solution = ex.en;
  cur.extra = listen ? ex.fr : '';
}

/* --- Paires --- */
function renderPairs(ex, body){
  const left = shuffle(ex.pairs.map((p,i)=>({s:p[0],i})));
  const right = shuffle(ex.pairs.map((p,i)=>({s:p[1],i})));
  body.innerHTML = `<h2 class="ex-title">Associe les paires</h2>
    <div class="pairs"><div class="col">${left.map(p=>`<button class="pair" data-side="l" data-i="${p.i}">${esc(p.s)}</button>`).join('')}</div>
    <div class="col">${right.map(p=>`<button class="pair" data-side="r" data-i="${p.i}">${esc(p.s)}</button>`).join('')}</div></div>`;
  let sel=null, matched=0; cur.hadError=false;
  body.querySelectorAll('.pair').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('matched')||cur.checked) return;
    if(b.dataset.side==='r') speak(ex.pairs[+b.dataset.i][1]);
    if(!sel || sel.dataset.side===b.dataset.side){ if(sel) sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
    if(sel.dataset.i===b.dataset.i){
      [sel,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('matched'); x.disabled=true; }); sel=null; matched++; tone([700],0.07);
      if(matched===ex.pairs.length){ cur.ready=true; doCheck(); }
    } else {
      cur.hadError=true; const a=sel; [a,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('err'); });
      setTimeout(()=>[a,b].forEach(x=>x.classList.remove('err')),350); sel=null; sndKo();
    }
  });
  cur.check = () => true;
  cur.solution = '';
}

/* --- Vérification --- */
const PRAISE = ['Excellent !','Bien joué !','Parfait !','Exactement !','Bravo !','Impeccable !'];
function doCheck(){
  if(!cur || cur.checked || !cur.ready) return;
  cur.checked = true;
  const ex = cur.ex;
  const ok = cur.check();
  if(ex.t!=='pairs') record(ex.key, ok);
  if(ok){
    LS.good++; sndOk();
    setFoot('ok', `<div class="fb-title">${I.check}${pick(PRAISE)}</div>${ex.t!=='mcq'&&ex.t!=='pairs'&&ex.t!=='fill'?`<div class="fb-ex">${esc(cur.extra||'')}</div>`:''}${ex.ex?`<div class="fb-ex">${esc(ex.ex)}</div>`:''}`);
    if(S.settings.autoread && ex.say && ex.t!=='listen') speak(ex.say);
    setMain('Continuer', true, 'ok');
  } else {
    LS.mistakes++; sndKo();
    if(LS.kind==='lesson') loseHeart();
    if(!LS.requeued.has(ex.key)){ LS.requeued.add(ex.key); LS.queue.push({...ex}); }
    const sol = cur.solution ? `<div class="fb-sol">${esc(cur.solution)}</div>` : '';
    setFoot('ko', `<div class="fb-title">${I.close}Réponse correcte :</div>${sol}${cur.extra?`<div class="fb-ex">${esc(cur.extra)}</div>`:''}${ex.ex?`<div class="fb-ex">${esc(ex.ex)}</div>`:''}`);
    if(S.settings.autoread && ex.say) speak(ex.say);
    setMain('Continuer', true, 'ko');
  }
  renderLessonHead();
  save();
}
function next(){
  if(LS.ended){ return closeLesson(); }
  if(LS.kind==='lesson' && hearts()<=0){ return outOfHearts(); }
  LS.idx++;
  if(LS.idx>=LS.queue.length) return finishLesson();
  renderEx();
}
$('lMain').onclick = () => { if(!LS) return; if(LS.ended || (cur && cur.checked)) next(); else doCheck(); };

function finishLesson(){
  LS.ended=true; cur=null;
  const perfect = LS.mistakes===0;
  let xp = LS.kind==='lesson' ? 10 + (perfect?5:0) : 10;
  const before = streakNow(), goalBefore = todayXp()>=S.settings.goal;
  addXp(xp);
  if(LS.kind==='lesson'){ S.done[LS.lessonId]=(S.done[LS.lessonId]||0)+1; }
  else { S.hearts=Math.min(MAX_HEARTS,S.hearts+1); }
  S.stats.lessons++;
  save(); sndWin();
  const secs = Math.round((Date.now()-LS.t0)/1000);
  const answered = LS.queue.filter(x=>x.t!=='pairs').length;
  const acc = Math.max(0, Math.round((answered-LS.mistakes)/Math.max(1,answered)*100));
  const st = streakNow();
  const goalNow = todayXp()>=S.settings.goal;
  const msg = st>before ? `Série : <b>${st} jour${st>1?'s':''}</b>. Reviens demain pour la prolonger.`
    : (goalNow && !goalBefore ? 'Objectif du jour atteint.' : (perfect ? 'Aucune erreur, +5 XP de bonus.' : 'Tes erreurs reviendront dans Révision.'));
  $('lBar').style.width='100%';
  $('lBody').innerHTML = `<div class="done-screen">
    <svg class="medal" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="var(--gold-soft)"/><circle cx="60" cy="60" r="38" fill="var(--gold)"/>
      <path d="m60 36 7 14.5 16 2.3-11.6 11.3 2.8 16L60 72.6l-14.2 7.5 2.8-16L37 52.8l16-2.3z" fill="#fff"/></svg>
    <h2>${LS.kind==='lesson'?(perfect?'Leçon parfaite !':'Leçon terminée !'):'Révision terminée !'}</h2>
    <p>${msg}</p>
    <div class="done-tiles">
      <div class="tile" style="--tc:var(--gold)"><div class="tl">XP</div><div class="tv num">+${xp}</div></div>
      <div class="tile" style="--tc:var(--ok)"><div class="tl">Précision</div><div class="tv num">${acc}%</div></div>
      <div class="tile" style="--tc:var(--primary)"><div class="tl">Temps</div><div class="tv num">${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div></div>
    </div></div>`;
  setFoot(null,null); setMain('Continuer', true);
  renderLessonHead();
}
function outOfHearts(){
  LS.ended=true; cur=null;
  $('lBody').innerHTML = `<div class="done-screen">
    <svg class="medal" viewBox="0 0 24 24" style="color:var(--heart);width:96px;height:96px" aria-hidden="true">${I.heart.replace(/<\/?svg[^>]*>/g,'')}</svg>
    <h2>Plus de cœurs</h2>

  setFoot(null,null); setMain('Quitter', true, 'ghost');
}
$('lQuit').onclick = () => {
  if(!LS || LS.ended) return closeLesson();
  openSheet(`<div class="eyebrow">Quitter la leçon</div><h3>Tu t'arrêtes là ?</h3><p>Ta progression dans cette leçon sera perdue.</p>
    <div class="row"><button class="btn" id="shStay">Continuer la leçon</button><button class="btn ghost" id="shLeave">Quitter</button></div>`);

};
document.addEventListener('keydown', e=>{
  if(!lessonOpen || $('sheetHost').firstChild) { if(e.key==='Escape') closeSheet(); return; }
  if(e.target.closest && e.target.closest('textarea,input')) return;
  if(e.key==='Enter'){ e.preventDefault(); $('lMain').click(); return; }
  if(e.key==='Escape'){ $('lQuit').click(); return; }
  if(cur && !cur.checked){
    if(/^[1-9]$/.test(e.key) && cur.choose){ cur.choose(+e.key-1); }
    if(e.key==='Backspace' && cur.back){ e.preventDefault(); cur.back(); }
  }
});

      html+=`<div class="node-wrap${isCur?' has-tag':''}" style="transform:translateX(${offsets[k++%offsets.length]}px)">

function exLabel(key){
  const [lid,rest]=key.split(':'); const e=LBY[lid]; if(!e) return null;
  if(rest[0]==='v'){ const p=e.l.vocab[+rest.slice(1)]; return p?`${p[0]} → ${p[1]}`:null; }
  const it=e.l.items[+rest]; if(!it) return null;
  return it.t==='order'?it.en : it.t==='fill'?it.s.replace('___',it.a) : it.a;
}
function renderReview(){
  const due=dueKeys(); const all=Object.keys(S.mist);

    <p>${due.length?`${due.length} point${due.length>1?'s':''} à revoir maintenant. Chaque erreur revient après 1, 3 puis 7 jours, jusqu'à ce que tu la maîtrises.`
      : anyDone?'Rien d\'urgent. Une révision mélange des exercices des leçons déjà faites.':'Termine une première leçon : tes erreurs et le vocabulaire vu viendront ici.'}</p>
    <p>Une révision ne coûte pas de cœurs et en rend un. +10 XP.</p>
    <button class="btn gold" id="revGo" ${(due.length||anyDone)?'':'disabled'}>Lancer une révision</button></div>`;
  if(all.length){
    html+=`<h3 class="section-h">Points à consolider (${all.length})</h3><div class="mist-list">`+
      all.sort((a,b)=>S.mist[a].d-S.mist[b].d).slice(0,30).map(k=>{ const lab=exLabel(k); if(!lab) return '';

  $('v-review').innerHTML=html;
  $('revGo').onclick=()=>startLesson('review');
}

async function runCoach(sc){
  const text=$('coachText').value.trim();
  if(text.length<15){ coachErr='Écris au moins une phrase complète.'; return renderCoach(); }
  coachBusy=true; coachErr=''; coachResult=null; renderCoach();
  $('coachOut').innerHTML='<p style="color:var(--ink-2)">Claude relit ton texte…</p>';
  const prompt=`You are a business English coach for a French-speaking professional (level B1-B2).
Task given to the learner: ${sc.task}
Learner's text:
"""
${text}
"""
Return ONLY valid JSON, no text around it, in this exact shape:
{"score": integer 0-10 for clarity, correctness and professional tone,
 "corrected": "a corrected, natural version in English, same intent and similar length",
 "issues": [{"original": "faulty excerpt", "fix": "correction", "why": "short explanation IN FRENCH"}],
 "tip": "one actionable tip IN FRENCH to improve",
 "phrase": "one idiomatic English phrase useful in this situation"}
At most 5 issues, most important first. Empty issues array if the text is already correct.`;
  try{
    const r = await sampleFn.json(prompt, {cache:false});
    if(!r || typeof r!=='object' || typeof r.corrected!=='string') throw {code:'bad_output'};
    coachResult={score:Math.max(0,Math.min(10,Math.round(+r.score||0))), corrected:r.corrected, issues:Array.isArray(r.issues)?r.issues.slice(0,5):[], tip:String(r.tip||''), phrase:String(r.phrase||'')};
    addXp(5); save(); renderTop();
  }catch(e){
    const c=e&&e.code;
    coachErr = c==='not_granted' ? 'Accès à Claude refusé pour cette session. Recharge la page pour réessayer.'
      : c==='rate_limited' ? 'Trop de demandes rapprochées. Attends une minute avant de relancer.'
      : 'La correction n\'a pas abouti. Relance dans un instant.';
  }
  coachBusy=false; renderCoach();
}
function drawCoach(r){
  $('coachOut').innerHTML=`<div class="card coach-out">
    <div class="score"><b class="num">${r.score}</b><span>/ 10</span></div>
    <div class="corrected"><div>${esc(r.corrected)}</div>${sayBtn(r.corrected,'inline')}</div>
    ${r.issues.map(i=>`<div class="issue"><s>${esc(i.original||'')}</s> → <ins>${esc(i.fix||'')}</ins><p>${esc(i.why||'')}</p></div>`).join('')}
    ${r.tip?`<div class="tip"><b>Conseil :</b> ${esc(r.tip)}</div>`:''}
    ${r.phrase?`<div class="prompt" style="margin:0">${sayBtn(r.phrase,'inline')}<div><b>À retenir :</b> ${esc(r.phrase)}</div></div>`:''}
  </div>`;
}

/* ---------- Profil ---------- */
function renderProfile(){
  const acc = S.stats.answered ? Math.round(S.stats.correct/S.stats.answered*100) : 0;
  const nDone = Object.keys(S.done).length;
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(Date.now()-(6-i)*DAY); return {k:dkey(d), l:'DLMMJVS'[d.getDay()]}; });
  const max=Math.max(S.settings.goal, ...days.map(d=>S.days[d.k]||0));
  const seg=(id,vals,cur,fmt)=>`<div class="seg" id="${id}">${vals.map(v=>`<button data-v="${v}" class="${String(v)===String(cur)?'on':''}">${fmt?fmt(v):v}</button>`).join('')}</div>`;
  const tog=(id,label,sub,val)=>`<div class="toggle"><label for="${id}" style="margin:0;font-weight:700">${label}<small>${sub}</small></label><input type="checkbox" id="${id}" ${val?'checked':''}></div>`;
  $('v-profile').innerHTML=`
    <div class="stats">
      <div class="st" style="color:var(--gold)">${I.flame}<div><b class="num">${streakNow()}</b><span>jours de série</span></div></div>
      <div class="st" style="color:var(--primary)">${I.bolt}<div><b class="num">${S.xp}</b><span>XP au total</span></div></div>
      <div class="st" style="color:var(--ok)">${I.check}<div><b class="num">${nDone} / ${LESSONS.length}</b><span>leçons terminées</span></div></div>
      <div class="st" style="color:var(--heart)">${I.target}<div><b class="num">${acc}%</b><span>de bonnes réponses</span></div></div>
    </div>
    <h3 class="section-h">7 derniers jours</h3>
    <div class="card"><div class="week">${days.map((d,i)=>{ const v=S.days[d.k]||0; return `<div class="wk${v>=S.settings.goal?' goal':''}${i===6?' is-today':''}">
      <div class="col"><i style="height:${Math.round(v/max*100)}%"></i></div><b class="num" style="font-size:12px">${v}</b><span>${d.l}</span></div>`; }).join('')}</div>
      <p style="font-size:13px">Barres dorées : objectif atteint (${S.settings.goal} XP).</p></div>
    <h3 class="section-h">Réglages</h3>
    <div class="card set">
      <div><label>Objectif quotidien</label>${seg('sGoal',[10,20,30,50],S.settings.goal,v=>v+' XP')}</div>
      ${canSpeak?`<div><label>Accent de la voix</label>${seg('sAccent',['en-GB','en-US'],S.settings.accent,v=>v==='en-GB'?'Britannique':'Américain')}</div>
      <div><label>Vitesse de lecture</label>${seg('sRate',[0.8,0.95,1.1],S.settings.rate,v=>({0.8:'Lente',0.95:'Normale',1.1:'Rapide'})[v])}</div>
      ${tog('sAuto','Lire les réponses à voix haute','Après chaque vérification',S.settings.autoread)}`:''}
      ${tog('sSound','Effets sonores','Bonne et mauvaise réponse',S.settings.sound)}
      ${tog('sInf','Cœurs illimités','Les erreurs ne coûtent plus de cœur',S.settings.infinite)}
      ${tog('sUnlock','Tout débloquer','Accès direct à toutes les unités',S.settings.unlockAll)}
      <div class="sync-note ${cloudRef?'cloud':''}"><i></i>${cloudRef?'Progression enregistrée sur ton compte Claude, retrouvée sur tous tes appareils.':'Progression enregistrée dans ce navigateur.'}</div>
      <div><button class="linkbtn" id="sReset">Remettre la progression à zéro</button></div>
    </div>`;
  const bindSeg=(id,key,cast)=>$(id)&&$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.settings[key]=cast(b.dataset.v); save(); renderProfile(); renderTop();
    if(key==='accent'||key==='rate') speak('Nice to meet you.'); });
  bindSeg('sGoal','goal',Number); bindSeg('sAccent','accent',String); bindSeg('sRate','rate',Number);
  const bindTog=(id,key)=>$(id)&&($(id).onchange=e=>{ S.settings[key]=e.target.checked; save(); renderTop(); });
  bindTog('sAuto','autoread'); bindTog('sSound','sound'); bindTog('sInf','infinite'); bindTog('sUnlock','unlockAll');
  $('sReset').onclick=()=>{
    openSheet(`<div class="eyebrow">Réinitialiser</div><h3>Tout effacer ?</h3><p>XP, série, leçons terminées et points à revoir seront supprimés. Tes réglages sont conservés.</p>
      <div class="row"><button class="btn ko" id="shYes">Effacer ma progression</button><button class="btn ghost" id="shNo">Annuler</button></div>`);
    $('shNo').onclick=closeSheet;
    $('shYes').onclick=()=>{ const keep=S.settings; S=defaults(); S.settings=keep; save(); closeSheet(); renderAll(); };
  };
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
try{ const v=localStorage.getItem(KEY+'-view'); if(v && v!=='coach' && ['path','review','profile'].includes(v)) currentView=v; }catch(e){}
['path','review','coach','profile'].forEach(x=>$('v-'+x).hidden = x!==currentView);
renderAll();
setInterval(()=>{ if(!lessonOpen) renderTop(); }, 60000);
initCloud();
(async()=>{
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const s = await claude.use('sample');
    if(s){ sampleFn=s; coachAvailable=true; if(!lessonOpen) renderNav(); }
  }catch(e){}
})();
</script>
